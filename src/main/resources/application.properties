# application.properties (improved / dev-friendly)
spring.application.name=backend

# ===============================
# = PostgreSQL Configuration
# ===============================
# Prefer environment variables for credentials. Eg:
#   export DB_URL=jdbc:postgresql://localhost:5432/HealthSpace
#   export DB_USER=postgres
#   export DB_PASS=HealthSpace
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/HealthSpace}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:HealthSpace}

# Optional but recommended
spring.datasource.driver-class-name=org.postgresql.Driver

# NOTE: "update" is convenient for dev but dangerous in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# = Server Configuration
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# = JPA & Hibernate Tweaks
# ===============================
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# = Logging
# ===============================
# Ensure 'logs' directory exists or replace with an absolute path your process can write to.
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=${LOG_FILE:logs/healthspace.log}

# ===============================
# = CORS
# (You said you handle CORS in CorsConfig.java, keep it there)
# ===============================

# ===============================
# = JWT (JSON Web Token) Settings
# ===============================
# IMPORTANT: in production supply JWT_SECRET via env var
jwt.secret=${JWT_SECRET:6685446b386a66fb17273e6c4151ea53a1ade077f11ac4034bc8bebe8f72a88e032635d3639b42a69e5bb3e8ea8d1614}
# jwt.expiration is milliseconds (28800000 = 8 hours)
jwt.expiration=${JWT_EXPIRATION:28800000}
