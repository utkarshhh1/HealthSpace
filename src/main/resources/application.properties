spring.application.name=backend
# ===============================
# = PostgreSQL Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=HealthSpace

# Optional but recommended
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# = Server Configuration
# ===============================
server.port=8080

# ===============================
# = JPA & Hibernate Tweaks
# ===============================
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# = Logging (Optional but Useful)
# ===============================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=logs/healthspace.log

# ===============================
# = CORS Configuration (if using React frontend)
# ===============================
# You can later move this to a Config class, but this allows API testing easily
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
